[project]
name = "gen-ai-event-research"
version = "0.1.0"
description = "Agentic event-driven alpha research with planted-signal evaluation"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "pandas>=2.0",
    "pyarrow>=14",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
agent = ["anthropic>=2.1", "python-dotenv>=1.2"]
rag = ["sentence-transformers>=3.0"]
llm = ["anthropic>=0.40"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
