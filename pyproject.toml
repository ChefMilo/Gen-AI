[project]
name = "gen-ai-event-research"
version = "0.1.0"
description = "Agentic event-driven alpha research with planted-signal evaluation"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
