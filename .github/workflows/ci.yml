name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Environment
        run: |
          python --version
          pip freeze
          python -c "import numpy; numpy.show_config()" | sed -n '/SIMD Extensions/,$p'
      - name: Plan hash by part (compare across machines)
        run: python scripts/plan_hash_parts.py --out results/ci/plan-hash-parts.json
      - run: ruff check .
      - run: pytest -q
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: final-plan-json
          path: results/ci/
          if-no-files-found: ignore
