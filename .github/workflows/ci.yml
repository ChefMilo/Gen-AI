name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python --version && pip freeze && nproc && python -c "import numpy; numpy.show_config()"
      - name: Plan hash, three fresh processes (diagnostic)
        run: |
          for h in 0 random; do
            PYTHONHASHSEED=$h python scripts/plan_hash_parts.py --out results/ci/plan-hash-$h.json
          done
          echo "--- AVX-512 dispatch disabled"
          NPY_DISABLE_CPU_FEATURES="X86_V4 AVX512_ICL AVX512_SPR" python scripts/plan_hash_parts.py --out results/ci/plan-no-avx512.json || true
      - run: ruff check .
      - run: pytest -q
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-plan-json
          path: results/ci/
          if-no-files-found: ignore
